[buildPlans.IosevkaAileCustom]
family = "Iosevka Aile Custom"
spacing = "quasi-proportional"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.IosevkaAileCustom.variants.design]
zero = "unslashed"
capital-d = "standard-serifless"
capital-i = "serifed"
capital-m = "hanging-serifless"
capital-q = "straight"
a = "single-storey-serifless"
d = "toothed-serifless"
f = "flat-hook-serifless"
g = "double-storey-open"
i = "serifless"
j = "serifed"
t = "flat-hook-short-neck"
y = "straight-serifless"

[buildPlans.IosevkaAileCustom.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaAileCustom.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.IosevkaAileCustom.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaAileCustom.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
